user nginx;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml text/plain;

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        absolute_redirect off;

        error_page 404 /404.html;

        # Astro builds /foo/index.html, so /foo and /foo/ both work
        location / {
            try_files $uri $uri/index.html =404;
            add_header Cache-Control "public, max-age=300";
        }

        # hashed file names, safe to cache forever
        location /_astro/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
